name: "Data or format request"
description: "Request a missing commune, a new field, or a new output format"
title: "[request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Use this to request additions — new records, fields, or output formats."

  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - Missing commune / daïra / wilaya
        - New field (e.g. coordinates, area, population)
        - New output format (e.g. CSV, YAML, SQL)
        - Language package (JS / Python / Java)
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: "Describe what you'd like added and why it's useful."
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source / reference (optional)
      description: "Anything that helps confirm or scope the request."
    validations:
      required: false
