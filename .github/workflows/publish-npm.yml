name: Publish npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Copy data into package
        run: |
          rm -rf packages/js/data
          cp -r data packages/js/data
          # data/raw/ is hand-edited build INPUT, never published output. It is
          # not part of the frozen 73-file contract and no consumer reads it,
          # but exports["./data/*"] would still expose it on npm and jsDelivr —
          # and reform.json's `todo` strings spell out the UNVERIFIED candidate
          # mere for each of the 11 new wilayas. docs/DECISIONS.md ADR-005
          # refuses to ship that table; shipping it as prose under the package's
          # public data subpath is the same table with a disclaimer attached.
          rm -rf packages/js/data/raw

      - name: Sync package version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/js
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --access public
        working-directory: packages/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
