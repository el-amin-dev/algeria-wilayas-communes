name: Publish npm

# NOTE: publish-npm.yml and publish-pypi.yml BOTH trigger on `v*`.
#
# One tag push publishes algeria-wilayas-communes to npm AND to PyPI, from the
# same commit, carrying the same data/. The npm and PyPI versions are locked in
# lockstep BY CONSTRUCTION, and neither workflow knows the other exists -- the
# coupling is real, load-bearing, and invisible in the YAML.
#
# Changing this trigger in one file without the other publishes mismatched
# versions to the two registries, which breaks the guarantee that
# `algeria-wilayas-communes@2.1.0` on npm and `==2.1.0` on PyPI hold the same
# 1541 records. See docs/DECISIONS.md ADR-015.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # REQUIRED for `npm publish --provenance`: it lets the runner mint the
      # OIDC token npm signs the attestation with. Without it the publish fails
      # with "Provenance generation ... failed", which does not name the cause.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # Trusted publishing needs npm CLI >= 11.5.1, and no Node version ships it
      # yet -- Node 20 bundles npm 10.x, Node 22 bundles npm 10.x/11.x depending
      # on the patch. Upgrading explicitly, and asserting the floor, is the
      # difference between a clear failure here and an EOTP further down that
      # names the wrong cause.
      - name: Upgrade npm to a version that can do trusted publishing
        run: |
          npm install -g npm@latest
          NPM_V=$(npm --version)
          echo "npm $NPM_V"
          node -e 'const v=process.argv[1].split(".").map(Number);
                   const ok = v[0]>11 || (v[0]===11 && (v[1]>5 || (v[1]===5 && v[2]>=1)));
                   if(!ok){console.error(`npm ${process.argv[1]} < 11.5.1 — trusted publishing unavailable`);process.exit(1);}
                   console.log("npm is new enough for trusted publishing");' "$NPM_V"

      # Session 4 made packages/js an ESM+CJS build: `exports` now points into
      # dist/, which is gitignored and does not exist in a fresh checkout.
      # Without these two steps `npm publish` would ship a tarball whose every
      # entry point 404s. The package's `prepack` also runs tsup, but prepack
      # cannot install the toolchain it needs -- that is what this is for.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # THIS MUST STAY ABOVE `Gate`. packages/js/data/ is gitignored and does
      # not exist in a fresh checkout, and two of the gated commands need it:
      # `pnpm test` asserts exports["./data/*"] resolves (tests/compat/cjs.test.ts),
      # and `pnpm lint:publish` runs publint, which packs the package and fails
      # with `pkg.exports["./data/*"] ... does not match any files`.
      #
      # Ordered the other way, this job dies at `Gate` on every tag -- while
      # publish-pypi.yml, which has no such dependency, uploads successfully.
      # That is precisely the lockstep break the header comment above and
      # ADR-015 exist to prevent, and PyPI never lets a filename be reused, so
      # the version would be unrecoverable.
      - name: Copy data into package
        run: |
          rm -rf packages/js/data
          cp -r data packages/js/data
          # data/raw/ is hand-edited build INPUT, never published output. It is
          # not part of the frozen 73-file contract and no consumer reads it,
          # but exports["./data/*"] would still expose it on npm and jsDelivr —
          # and reform.json's `todo` strings spell out the UNVERIFIED candidate
          # mere for each of the 11 new wilayas. docs/DECISIONS.md ADR-005
          # refuses to ship that table; shipping it as prose under the package's
          # public data subpath is the same table with a disclaimer attached.
          rm -rf packages/js/data/raw

      # A tag push publishes immediately and irreversibly -- npm allows unpublish
      # only within 72 hours, and never for a version anyone has depended on. So
      # every gate this repo has runs HERE, before `npm publish`, rather than
      # trusting that it ran earlier.
      #
      # ci.yml's `node` job now runs the same set on every push and PR, so this
      # is deliberate belt-and-braces rather than the only coverage it once was:
      # a tag can be pushed at a commit CI never saw, and this is the last gate
      # before an irreversible operation.
      - name: Gate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm lint:publish
          pnpm size

      # pack:check runs after the data copy, since it asserts the tarball carries
      # the whole 73-file contract -- which only exists once the copy has run.
      - name: Check the tarball
        run: pnpm pack:check

      - name: Sync package version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/js
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # NO NODE_AUTH_TOKEN, deliberately. This publishes via npm TRUSTED
      # PUBLISHING (OIDC): the runner presents its GitHub identity and npm mints
      # a short-lived credential, so there is no long-lived secret to leak,
      # rotate or expire.
      #
      # It replaces a token path that NEVER ONCE WORKED. The history, from
      # `gh run list` and `gh api .../actions/secrets`:
      #
      #   2026-07-20 23:49  NPM_TOKEN created
      #   2026-07-21 00:30  tag v1.0.0 -> PyPI published, npm FAILED (EOTP)
      #   2026-07-21 00:59  npm 1.0.0 published BY HAND with an interactive OTP
      #   2026-07-21 00:59  NPM_TOKEN rotated, 40 seconds later
      #   2026-07-21 01:08  tag v1.1.0 -> PyPI published, npm FAILED (EOTP again)
      #
      # `npm error code EOTP` means npm demanded a one-time password, which no
      # unattended runner can supply. Rotating the token did not help and never
      # will: EOTP is about the token's TYPE and the account's 2FA policy, not
      # its age. That is the whole reason npm 1.0.0 and PyPI 1.1.0 drifted apart
      # (ADR-015), and why re-tagging with a fresh token of the same kind would
      # simply fail a third time.
      #
      # SETUP REQUIRED ON npmjs.com, once: package -> Settings -> Trusted
      # Publisher -> GitHub Actions, naming this repository and the workflow
      # file `publish-npm.yml`. Until that exists, this step fails loudly with an
      # auth error rather than publishing something wrong -- which is the
      # correct behaviour for an irreversible operation.
      #
      # `--provenance` stays explicit. Trusted publishing generates an
      # attestation anyway, but the flag documents the intent and keeps the step
      # correct if the auth mechanism is ever changed back. It ties this tarball
      # to this commit and this workflow run, verifiably by anyone, and npm shows
      # a "Built and signed on GitHub Actions" badge on the package page. For a
      # dataset a company is about to encode into an address form, "I can see
      # which commit produced these bytes" is the difference between adoption and
      # a security review that never finishes.
      #
      # A prerelease MUST NOT become the default install.
      #
      # `npm publish` with no --tag always writes `latest`, so `git tag v2.0.0-rc.1`
      # would serve the RC to everyone running `npm i algeria-wilayas-communes`
      # until someone noticed and re-tagged by hand. Semver says a version with a
      # hyphen is a prerelease; that is the whole test.
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing $VERSION to dist-tag: $TAG"
          npm publish --access public --provenance --tag "$TAG"
        working-directory: packages/js
