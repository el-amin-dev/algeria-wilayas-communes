name: Publish PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy data into package
        run: |
          rm -rf packages/python/src/algeria_wilayas_communes/data
          cp -r data packages/python/src/algeria_wilayas_communes/data

      - name: Sync version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packages/python/pyproject.toml

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build packages/python --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
