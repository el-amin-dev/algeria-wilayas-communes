name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing three commits to a PR in two minutes currently runs three full
# matrices to completion; only the last one's result is ever read. Cancelling
# the superseded runs is free.
#
# NEVER copy this into a publish workflow. Cancelling publish-npm.yml halfway
# through is how a version reaches npm and not PyPI, and the two are supposed to
# be lockstep at one version.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check all JSON files are valid
        run: |
          find data shared/schema -name '*.json' -print0 \
            | xargs -0 -I{} sh -c 'jq empty "{}" || { echo "Invalid JSON: {}"; exit 1; }'

      - name: Install schema validator
        run: pip install check-jsonschema

      - name: Validate source against JSON Schema
        run: check-jsonschema --schemafile shared/schema/algeria.schema.json data/algeria.json

      - name: Validate reform stub against JSON Schema
        run: check-jsonschema --schemafile shared/schema/reform.schema.json data/raw/reform.json

      - name: Run integrity checks
        run: python3 shared/validate.py

  # The Python package had NO CI coverage at all before session 5: it was never
  # built, imported, tested, type-checked or linted by any workflow, while the
  # JavaScript side accumulated 1136 tests. The two shipped from the same tag.
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      # One version failing must not cancel the others. A 3.9-only break is
      # exactly the kind this matrix exists to surface, and fail-fast would
      # hide whether it is version-specific or universal.
      fail-fast: false
      matrix:
        # Must agree with `requires-python = ">=3.9"` in
        # packages/python/pyproject.toml. Listing a version the floor excludes
        # would make the install step fail and the job would be testing
        # nothing; dropping one the floor allows would let it rot untested.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The same step `make dev` runs. Having CI depend on it is deliberate: if
      # the local-development path breaks, this job goes red before a
      # contributor hits it as an unexplained FileNotFoundError.
      - name: Link dataset into the package
        run: ln -sfn ../../../../data packages/python/src/algeria_wilayas_communes/data

      - name: Install
        run: python -m pip install -e "packages/python[dev]"

      - name: Test
        run: python -m pytest packages/python -q

      - name: Type check
        run: python -m mypy packages/python/src

      - name: Lint
        run: python -m ruff check packages/python

      - name: Format check
        run: python -m ruff format --check packages/python

  # The two packages describe one dataset and must agree about it. Locally the
  # conformance and cross-language tests skip when packages/js/dist is absent,
  # which means the assertion that actually matters -- that 2132 record ids and
  # every search result are identical across the two languages -- can silently
  # never run. This job has both toolchains, so it runs them for real.
  #
  # Separate from `python` on purpose: a Python-only failure should not be
  # buried under a Node build log.
  cross-language:
    name: Cross-language conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # 22, not 20: pnpm 11.21.0 requires Node >= 22.13 and fails in this step
      # on anything older.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # packages/js/dist is gitignored, so the cross-language test has nothing
      # to compare against until this runs.
      - name: Build the JavaScript package
        run: pnpm build

      - name: Link dataset into the Python package
        run: ln -sfn ../../../../data packages/python/src/algeria_wilayas_communes/data

      - name: Install the Python package
        run: python -m pip install -e "packages/python[dev]"

      # The generated fixtures must match what the generator produces, or the
      # shared contract is describing a build nobody ran.
      - name: Check the shared fixtures are current
        run: pnpm build:data --check

      - name: JavaScript conformance
        run: pnpm vitest run tests/shared-fixtures.test.ts

      # The cross-language tests skip themselves when the JS bundle is absent,
      # which is right locally and wrong here: this job exists BECAUSE those are
      # the assertions that must not silently never run. Without this
      # precondition, a build that stopped emitting index.cjs would turn the
      # whole job into a green no-op.
      - name: Assert the JS bundle the diff needs actually exists
        run: test -f packages/js/dist/index.cjs

      - name: Python conformance and cross-language diff
        run: |
          python -m pytest \
            packages/python/tests/test_shared_fixtures.py \
            packages/python/tests/test_cross_language.py \
            -q

  # No CI job has ever typechecked, linted, tested or sized the JavaScript
  # package -- sessions 1-5 accumulated 1136 tests and eight size budgets that
  # ran only on the maintainer's machine, or inside publish-npm.yml, which is to
  # say AFTER an irreversible tag push. This job is the whole point of session 6.
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # Same reasoning as the python matrix: a 24-only break is exactly what
      # this matrix exists to surface, and fail-fast would cancel 22 before it
      # could tell you whether the break is version-specific or universal.
      fail-fast: false
      matrix:
        # These are the versions the DEV TOOLCHAIN runs on, which is not the
        # same question as the runtime floor we promise consumers. Measured from
        # the installed manifests:
        #
        #   pnpm@11.21.0  >=22.13        (pinned by `packageManager`)
        #   size-limit@13 ^22.18 || ^24  || >=26
        #   eslint@10     ^20.19 || ^22.13 || >=24
        #
        # So 18 and 20 cannot run this job at all -- Node 18 fails in
        # `Set up Node` with "This version of pnpm requires at least Node.js
        # v22.13" before a single gate executes.
        #
        # `engines.node` is `">=18"`, and that promise is still tested -- by the
        # `engines-floor` job below, which imports the BUILT artifact on 18 and
        # 20 without the toolchain. Testing the floor with a toolchain that
        # cannot run on it proves nothing and produces a permanently red matrix.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup MUST come before setup-node: `cache: pnpm` makes
      # setup-node shell out to pnpm to resolve the store path, so the binary
      # has to exist first. Reversed, this fails with "Unable to locate
      # executable file: pnpm", which reads like a missing dependency rather
      # than an ordering bug.
      #
      # No `version:` input, deliberately -- action-setup reads
      # `packageManager` from package.json, so the pin lives in exactly one
      # place and CI cannot drift from the maintainer's pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      # --frozen-lockfile always. A CI run that silently resolves a different
      # dependency tree than the lockfile is not a check.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # BUILD BEFORE TESTS -- the ordering is load-bearing, not cosmetic.
      #
      # tests/compat/cjs.test.ts skips its whole `require()` suite when
      # packages/js/dist/ is absent, and then asserts unconditionally that dist/
      # existed. Run tests first on a fresh checkout and that assertion fails,
      # reporting a missing build as a test failure. The CJS contract is exactly
      # the thing that went one whole release untested, so the suite is built to
      # be loud about being unable to check it.
      - name: Build
        run: pnpm build

      # packages/js/data/ is gitignored -- it exists only because
      # publish-npm.yml copies data/ in before packing. Two things below need
      # it: tests/compat/cjs.test.ts proves exports["./data/*"] still resolves
      # (a v1 contract jsDelivr and CDN consumers depend on), and `lint:publish`
      # runs publint, which packs the package and reports
      # `pkg.exports["./data/*"] ... does not match any files` when it is absent.
      #
      # A COPY, byte-for-byte the same two lines as publish-npm.yml -- NOT the
      # symlink `make dev` creates locally. `pnpm pack` does not follow a
      # symlinked directory, so a link satisfies Node's resolver and the test
      # suite while still producing a tarball with no data in it, and publint
      # fails on exactly the discrepancy a consumer would hit. Mirroring the
      # publish workflow here is the point: this job exists to catch a publish
      # problem before the tag, not after it.
      - name: Copy data into the package
        run: |
          rm -rf packages/js/data
          cp -r data packages/js/data
          rm -rf packages/js/data/raw

      - name: Type tests
        run: pnpm test:types

      - name: Tests with coverage
        run: pnpm test:coverage

      - name: Publish lint
        run: pnpm lint:publish

      - name: Size budgets
        run: pnpm size

      # Sessions 4 and 5 built these two gates and wired them to nothing. They
      # answer questions no unit test can: does importing `getWilayas` build a
      # commune index (import-time), and can a bundler actually drop the commune
      # table from a narrow entry (tree-shaking)?
      - name: Import-time purity gate
        run: pnpm bench:import

      - name: Tree-shaking proof
        run: pnpm treeshake:proof

  # packages/js/package.json promises `engines.node: ">=18"`. Nothing tested
  # that promise until now, and the `node` job cannot: pnpm 11, eslint 10 and
  # size-limit 13 all refuse to run on 18 or 20, so a matrix leg there dies in
  # `Set up Node` without executing a gate.
  #
  # The promise is about the PUBLISHED ARTIFACT, not the toolchain -- a consumer
  # on Node 18 runs `dist/`, never vitest. So this job builds on 22 and then
  # re-points Node at the floor versions and imports what a consumer would.
  #
  # This is the same class of defect as ADR-014, where packages/python declared
  # `requires-python = ">=3.8"` while its loader called a 3.9+ API and pip
  # happily installed a package that could not import. A declared floor nothing
  # exercises is a guess.
  engines-floor:
    name: engines.node floor (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 18 is the declared floor; 20 is the next LTS a consumer plausibly
        # still runs. If either fails, `engines.node` is lying and must move.
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Build on a version the toolchain supports ...
      - name: Set up Node 22 to build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ... then switch the runtime to the floor. No `cache: pnpm` here: that
      # makes setup-node shell out to `pnpm store path`, which would fail on
      # Node 18 for the very reason this job exists. Nothing below runs pnpm.
      - name: Switch to Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: The built ESM entry must import
        run: |
          node --version
          node -e '
            import("./packages/js/dist/index.mjs").then((m) => {
              if (m.getWilayas().length !== 69) throw new Error("wilayas != 69");
              if (m.getCommunes().length !== 1541) throw new Error("communes != 1541");
              if (m.findByPostalCode("19018").length !== 1) throw new Error("19018 lookup broken");
              if (m.getCommune("19-ain-azel-ain-lahdjar") === undefined) throw new Error("canonical commune missing");
              if (m.search("setif")[0].score !== 1) throw new Error("search broken");
              console.log("esm ok on " + process.version);
            }).catch((e) => { console.error(e); process.exit(1); });
          '

      - name: The built CJS entry must require
        run: |
          node -e '
            const dz = require("./packages/js/dist/index.cjs");
            if (dz.getWilayas().length !== 69) throw new Error("cjs wilayas != 69");
            if (dz.getCommunes().length !== 1541) throw new Error("cjs communes != 1541");
            console.log("cjs ok on " + process.version);
          '

      - name: The narrow subpaths must load too
        run: |
          node -e '
            Promise.all([
              import("./packages/js/dist/wilayas.mjs"),
              import("./packages/js/dist/dairas.mjs"),
              import("./packages/js/dist/communes.mjs"),
              import("./packages/js/dist/legacy.mjs"),
            ]).then(([w, d, c, l]) => {
              if (w.getWilayas().length !== 69) throw new Error("/wilayas broken");
              if (d.getDairas().length !== 591) throw new Error("/dairas broken");
              if (c.getCommunes().length !== 1541) throw new Error("/communes broken");
              if (l.default.getWilayas().length !== 69) throw new Error("/legacy default export broken");
              console.log("subpaths ok on " + process.version);
            }).catch((e) => { console.error(e); process.exit(1); });
          '

  # Bun is CI-only: it is not installed on the maintainer's machine, so it must
  # never appear in a package.json script or a git hook. A script nobody can run
  # locally is worse than no script.
  #
  # Separate from the `node` matrix rather than a fourth leg: Bun needs a
  # different setup action and runs different commands, and folding it in
  # produces a job of `if:` conditionals nobody can read.
  #
  # It runs against the BUILT dist/, not the source, because the question Bun
  # answers is "does the published artifact load in a non-Node runtime" -- and
  # only dist/ can answer that.
  bun:
    name: Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The canonical example (ADR-006): wilaya 19 Setif, commune
      # 19-ain-azel-ain-lahdjar, postal code 19018.
      - name: Import the built ESM entry under Bun
        run: |
          bun -e '
            const m = await import("./packages/js/dist/index.mjs");
            if (m.getWilayas().length !== 69) throw new Error("wilayas != 69");
            if (m.getCommunes().length !== 1541) throw new Error("communes != 1541");
            if (m.findByPostalCode("19018").length === 0) throw new Error("19018 not found");
            if (m.getCommune("19-ain-azel-ain-lahdjar") === undefined) throw new Error("canonical commune missing");
            console.log("bun esm ok");
          '

      - name: Import the built CJS entry under Bun
        run: |
          bun -e '
            const dz = require("./packages/js/dist/index.cjs");
            if (dz.getWilayas().length !== 69) throw new Error("cjs wilayas != 69");
            if (dz.getCommunes().length !== 1541) throw new Error("cjs communes != 1541");
            console.log("bun cjs ok");
          '

  # data/ is a published contract: jsDelivr serves it, the README's jq examples
  # read it, and the Python wheel vendors it. `scripts/build-data.ts` is the only
  # thing allowed to write it, and it must reproduce every byte that is already
  # committed. `git diff` IS the specification -- there is nothing else to assert.
  #
  # Separate from `validate`, which needs Python and no Node. Splitting them
  # means a generator regression cannot hide under a dataset failure.
  data:
    name: Data generator is byte-identical
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild every derived file
        run: pnpm build:data

      - name: data/ must be unchanged
        run: |
          git diff --exit-code data/ || {
            echo "::error::scripts/build-data.ts no longer reproduces data/ byte-identically"
            git diff --stat data/
            exit 1
          }

      # --check covers the 80 outputs the generator owns, not just data/: the
      # generated TypeScript under packages/js/src/generated/ and the shared
      # fixtures both languages read. A tree where data/ matches but the
      # fixtures do not is a tree where the cross-language contract is
      # describing a build nobody ran.
      - name: Every generated output must be current
        run: pnpm build:data --check

      - name: Nothing else moved either
        run: |
          git diff --exit-code || {
            echo "::error::the build wrote outside data/ -- generated TS or shared fixtures are stale"
            git diff --stat
            exit 1
          }
